<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《战争与和平》人物关系图谱</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 280px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #0f3460;
            flex-shrink: 0;
        }

        #sidebar h1 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #e94560;
            text-align: center;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 12px;
        }

        .legend-section {
            margin-bottom: 16px;
        }

        .legend-section h3 {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .legend-item:hover {
            background: #0f3460;
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .legend-line {
            width: 24px;
            height: 3px;
            margin-right: 10px;
            flex-shrink: 0;
            border-radius: 2px;
        }

        .legend-line.dashed {
            background: repeating-linear-gradient(
                90deg,
                currentColor 0px,
                currentColor 4px,
                transparent 4px,
                transparent 7px
            );
            height: 2px;
        }

        #network {
            flex: 1;
            height: 100vh;
        }

        #info-panel {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        #info-panel h2 {
            color: #e94560;
            font-size: 16px;
            margin-bottom: 8px;
        }

        #info-panel p {
            font-size: 13px;
            line-height: 1.6;
            color: #ccc;
        }

        #info-panel .close-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            cursor: pointer;
            color: #888;
            font-size: 18px;
        }

        #info-panel .close-btn:hover {
            color: #e94560;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 50;
        }

        .controls button {
            background: #16213e;
            border: 1px solid #0f3460;
            color: #eee;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .controls button:hover {
            background: #0f3460;
            border-color: #e94560;
        }

        .filter-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #0f3460;
        }

        .filter-section h3 {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .filter-btn {
            display: inline-block;
            padding: 4px 10px;
            margin: 3px;
            font-size: 11px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid;
            transition: all 0.2s;
        }

        .filter-btn.active {
            opacity: 1;
        }

        .filter-btn.inactive {
            opacity: 0.4;
        }

        #search-box {
            width: 100%;
            padding: 8px 12px;
            background: #0f3460;
            border: 1px solid #1a4080;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
            margin-bottom: 16px;
            outline: none;
        }

        #search-box::placeholder {
            color: #666;
        }

        #search-box:focus {
            border-color: #e94560;
        }

        #translation-select {
            width: 100%;
            padding: 8px 12px;
            background: #0f3460;
            border: 1px solid #1a4080;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        #translation-select:focus {
            border-color: #e94560;
        }

        #translation-select option {
            background: #16213e;
            color: #eee;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h1>《战争与和平》<br>人物关系图谱</h1>

            <input type="text" id="search-box" placeholder="搜索人物...">

            <div class="legend-section">
                <h3>家族</h3>
                <div class="legend-item" data-family="rostov">
                    <span class="legend-dot" style="background: #4ecdc4;"></span>
                    罗斯托夫家族
                </div>
                <div class="legend-item" data-family="bolkonsky">
                    <span class="legend-dot" style="background: #ffe66d;"></span>
                    保尔康斯基家族
                </div>
                <div class="legend-item" data-family="bezukhov">
                    <span class="legend-dot" style="background: #ff6b6b;"></span>
                    别祖霍夫家族
                </div>
                <div class="legend-item" data-family="kuragin">
                    <span class="legend-dot" style="background: #c44dff;"></span>
                    库拉金家族
                </div>
                <div class="legend-item" data-family="drubetskoy">
                    <span class="legend-dot" style="background: #45b7d1;"></span>
                    德鲁别茨科伊家族
                </div>
                <div class="legend-item" data-family="other">
                    <span class="legend-dot" style="background: #96ceb4;"></span>
                    其他重要人物
                </div>
            </div>

            <div class="legend-section">
                <h3>关系类型</h3>
                <div class="legend-item">
                    <span class="legend-line" style="background: #e94560;"></span>
                    夫妻/恋人
                </div>
                <div class="legend-item">
                    <span class="legend-line" style="background: #4ecdc4;"></span>
                    亲子关系
                </div>
                <div class="legend-item">
                    <span class="legend-line" style="background: #ffe66d;"></span>
                    兄弟姐妹
                </div>
                <div class="legend-item">
                    <span class="legend-line" style="background: #45b7d1;"></span>
                    友谊
                </div>
                <div class="legend-item">
                    <span class="legend-line dashed" style="color: #ff6b6b;"></span>
                    对立/冲突
                </div>
            </div>

            <div class="filter-section">
                <h3>译本切换</h3>
                <select id="translation-select">
                    <option value="caoying" selected>草婴译本</option>
                    <option value="liuliaoyi">刘辽逸译本</option>
                    <option value="gaozhi">高植译本</option>
                </select>
            </div>

            <div class="filter-section">
                <h3>显示控制</h3>
                <div id="family-filters"></div>
            </div>
        </div>

        <div id="network"></div>

        <div id="info-panel">
            <span class="close-btn" onclick="closeInfoPanel()">&times;</span>
            <h2 id="info-name"></h2>
            <p id="info-desc"></p>
        </div>

        <div class="controls">
            <button onclick="resetView()">重置视图</button>
            <button id="physics-btn" onclick="togglePhysics()">物理引擎：开</button>
        </div>
    </div>

            { id: 63, label: "朱莉·卡拉金娜", family: "other", desc: "莫斯科富家女，玛丽雅的笔友，最终嫁给了保里斯·德鲁别茨科伊。" },
            { id: 64, label: "亚历山大一世", family: "other", desc: "俄国沙皇，年轻有理想主义倾向，与拿破仑从结盟到对抗，最终领导反法联盟取得胜利。" },
            { id: 65, label: "阿赫罗西莫娃", family: "other", desc: "莫斯科社交界的'可怕女龙'，性格刚直坦率，是罗斯托夫家的朋友，曾保护娜塔莎。" },
            { id: 66, label: "巴兹杰耶夫", family: "other", desc: "共济会长老，在旅途中偶遇皮埃尔，引导他加入共济会，深刻影响了皮埃尔的精神追求。" },
            { id: 67, label: "罗斯托普钦伯爵", family: "other", desc: "1812年莫斯科总督，在法军入侵前煽动民众情绪，下令焚烧莫斯科。" },
            { id: 68, label: "缪拉", family: "other", desc: "拿破仑麾下元帅，法军骑兵统帅，以勇猛和华丽军服著称。" },
            { id: 69, label: "吉洪·谢尔巴特", family: "other", desc: "杰尼索夫游击队中最勇猛的农民战士，擅长捉'舌头'（俘虏），代表人民战争的力量。" },
            { id: 70, label: "拉夫鲁什卡", family: "other", desc: "尼古拉·罗斯托夫的勤务兵，机灵狡黠的农奴，后转为杰尼索夫的勤务兵。" },
        ];

        // Relationship data
        const relationships = [
            // 罗斯托夫家族内部
            { from: 1, to: 2, label: "夫妻", type: "marriage" },
            { from: 1, to: 3, label: "父子", type: "parent" },
            { from: 1, to: 4, label: "父女", type: "parent" },
            { from: 1, to: 5, label: "父子", type: "parent" },
            { from: 1, to: 6, label: "父女", type: "parent" },
            { from: 2, to: 7, label: "养母", type: "parent" },
            { from: 3, to: 4, label: "兄妹", type: "sibling" },
            { from: 3, to: 5, label: "兄弟", type: "sibling" },
            { from: 4, to: 5, label: "姐弟", type: "sibling" },

            // 博尔孔斯基家族内部
            { from: 10, to: 11, label: "父子", type: "parent" },
            { from: 10, to: 12, label: "父女", type: "parent" },
            { from: 11, to: 12, label: "兄妹", type: "sibling" },
            { from: 11, to: 13, label: "夫妻", type: "marriage" },
            { from: 11, to: 14, label: "父子", type: "parent" },
            { from: 13, to: 14, label: "母子", type: "parent" },

            // 别祖霍夫家族
            { from: 21, to: 20, label: "父子", type: "parent" },

            // 库拉金家族内部
            { from: 30, to: 31, label: "父女", type: "parent" },
            { from: 30, to: 32, label: "父子", type: "parent" },
            { from: 30, to: 33, label: "父子", type: "parent" },
            { from: 31, to: 32, label: "姐弟", type: "sibling" },

            // 德鲁别茨科伊家族
            { from: 40, to: 41, label: "母子", type: "parent" },

            // 跨家族关系 - 婚姻/恋爱
            { from: 20, to: 31, label: "前夫妻", type: "marriage" },
            { from: 20, to: 4, label: "夫妻", type: "marriage" },
            { from: 11, to: 4, label: "曾订婚", type: "marriage" },
            { from: 3, to: 12, label: "夫妻", type: "marriage" },
            { from: 6, to: 54, label: "夫妻", type: "marriage" },
            { from: 32, to: 4, label: "诱骗私奔", type: "conflict" },
            { from: 3, to: 7, label: "单恋", type: "marriage" },
            { from: 52, to: 4, label: "曾求婚", type: "marriage" },
            { from: 41, to: 4, label: "曾追求", type: "marriage" },

            // 友谊
            { from: 20, to: 11, label: "挚友", type: "friendship" },
            { from: 3, to: 52, label: "战友", type: "friendship" },
            { from: 20, to: 55, label: "精神导师", type: "friendship" },
            { from: 41, to: 3, label: "少年友谊", type: "friendship" },

            // 冲突
            { from: 20, to: 53, label: "决斗", type: "conflict" },
            { from: 53, to: 31, label: "情人", type: "conflict" },
            { from: 50, to: 51, label: "对战", type: "conflict" },

            // 其他社交关系
            { from: 30, to: 20, label: "觊觎遗产", type: "conflict" },
            { from: 30, to: 12, label: "曾为子求婚", type: "conflict" },

            // 新增人物关系
            { from: 57, to: 50, label: "部下", type: "friendship" },
            { from: 11, to: 58, label: "追随改革", type: "friendship" },
            { from: 11, to: 59, label: "战场赏识", type: "friendship" },
            { from: 59, to: 60, label: "战友", type: "friendship" },
            { from: 12, to: 61, label: "女伴", type: "friendship" },
            { from: 11, to: 62, label: "好友", type: "friendship" },
            { from: 12, to: 63, label: "笔友", type: "friendship" },
            { from: 41, to: 63, label: "夫妻", type: "marriage" },
            { from: 3, to: 57, label: "敬仰", type: "friendship" },

            // 新增人物关系（第二批）
            { from: 64, to: 50, label: "任命总司令", type: "friendship" },
            { from: 64, to: 51, label: "对抗", type: "conflict" },
            { from: 64, to: 58, label: "君臣", type: "friendship" },
            { from: 65, to: 1, label: "世交", type: "friendship" },
            { from: 65, to: 4, label: "保护", type: "friendship" },
            { from: 66, to: 20, label: "精神引导", type: "friendship" },
            { from: 67, to: 50, label: "政见分歧", type: "conflict" },
            { from: 68, to: 51, label: "部下", type: "friendship" },
            { from: 69, to: 52, label: "部下", type: "friendship" },
            { from: 70, to: 3, label: "勤务兵", type: "friendship" },
            { from: 70, to: 52, label: "勤务兵", type: "friendship" },
        ];

        // Color scheme
        const familyColors = {
            rostov: { background: "#4ecdc4", border: "#3db8b0", highlight: { background: "#6fe8e0", border: "#4ecdc4" } },
            bolkonsky: { background: "#ffe66d", border: "#e6cf5a", highlight: { background: "#fff09a", border: "#ffe66d" } },
            bezukhov: { background: "#ff6b6b", border: "#e65555", highlight: { background: "#ff9999", border: "#ff6b6b" } },
            kuragin: { background: "#c44dff", border: "#a33dd6", highlight: { background: "#d580ff", border: "#c44dff" } },
            drubetskoy: { background: "#45b7d1", border: "#3a9bb2", highlight: { background: "#70cce0", border: "#45b7d1" } },
            other: { background: "#96ceb4", border: "#7ab89c", highlight: { background: "#b5e0cc", border: "#96ceb4" } }
        };

        const edgeColors = {
            marriage: "#e94560",
            parent: "#4ecdc4",
            sibling: "#ffe66d",
            friendship: "#45b7d1",
            conflict: "#ff6b6b"
        };

        const familyNames = {
            rostov: "罗斯托夫",
            bolkonsky: "保尔康斯基",
            bezukhov: "别祖霍夫",
            kuragin: "库拉金",
            drubetskoy: "德鲁别茨科伊",
            other: "其他"
        };

        // Family name translations
        const familyNameTranslations = {
            caoying: {
                rostov: "罗斯托夫",
                bolkonsky: "保尔康斯基",
                bezukhov: "别祖霍夫",
                kuragin: "库拉金",
                drubetskoy: "德鲁别茨科伊",
                other: "其他"
            },
            liuliaoyi: {
                rostov: "罗斯托夫",
                bolkonsky: "博尔孔斯基",
                bezukhov: "别祖霍夫",
                kuragin: "库拉金",
                drubetskoy: "德鲁别茨科伊",
                other: "其他"
            },
            gaozhi: {
                rostov: "罗斯托夫",
                bolkonsky: "鲍尔康斯基",
                bezukhov: "别竺豪夫",
                kuragin: "库拉根",
                drubetskoy: "德鲁别茨科伊",
                other: "其他"
            }
        };

        // Build nodes
        const nodes = new vis.DataSet(characters.map(c => ({
            id: c.id,
            label: c.label,
            group: c.family,
            title: c.desc,
            color: familyColors[c.family],
            font: { color: "#eee", size: 13, face: "Microsoft YaHei", strokeWidth: 2, strokeColor: "#1a1a2e" },
            shape: "dot",
            size: c.id === 20 || c.id === 11 || c.id === 4 ? 28 : (c.id === 50 || c.id === 51 ? 24 : 18),
            borderWidth: 2,
            shadow: true
        })));

        // Build edges
        const edges = new vis.DataSet(relationships.map((r, i) => ({
            id: i,
            from: r.from,
            to: r.to,
            label: r.label,
            color: { color: edgeColors[r.type], highlight: edgeColors[r.type], hover: edgeColors[r.type] },
            font: { color: "#aaa", size: 10, strokeWidth: 2, strokeColor: "#1a1a2e" },
            width: r.type === "marriage" ? 2.5 : 1.5,
            dashes: r.type === "conflict" ? [5, 5] : false,
            smooth: { type: "continuous", roundness: 0.2 },
            arrows: r.type === "parent" ? { to: { enabled: true, scaleFactor: 0.6 } } : undefined
        })));

        // Network options
        const options = {
            physics: {
                enabled: true,
                forceAtlas2Based: {
                    gravitationalConstant: -60,
                    centralGravity: 0.008,
                    springLength: 160,
                    springConstant: 0.03,
                    damping: 0.5
                },
                solver: "forceAtlas2Based",
                stabilization: { iterations: 200 }
            },
            interaction: {
                hover: true,
                tooltipDelay: 200,
                dragNodes: true,
                dragView: true,
                zoomView: true,
                navigationButtons: false
            },
            nodes: {
                font: { size: 13 },
                borderWidth: 2,
                shadow: { enabled: true, color: "rgba(0,0,0,0.3)", size: 8 }
            },
            edges: {
                smooth: { type: "continuous" },
                font: { size: 10, align: "middle" }
            },
            groups: {
                rostov: { color: familyColors.rostov },
                bolkonsky: { color: familyColors.bolkonsky },
                bezukhov: { color: familyColors.bezukhov },
                kuragin: { color: familyColors.kuragin },
                drubetskoy: { color: familyColors.drubetskoy },
                other: { color: familyColors.other }
            }
        };

        // Initialize network
        const container = document.getElementById("network");
        const data = { nodes, edges };
        const network = new vis.Network(container, data, options);

        // Active family filters
        const activeFilters = new Set(Object.keys(familyColors));

        // Generate filter buttons
        const filterContainer = document.getElementById("family-filters");
        Object.entries(familyNames).forEach(([key, name]) => {
            const btn = document.createElement("span");
            btn.className = "filter-btn active";
            btn.style.borderColor = familyColors[key].background;
            btn.style.color = familyColors[key].background;
            btn.textContent = name;
            btn.dataset.family = key;
            btn.addEventListener("click", () => toggleFamily(key, btn));
            filterContainer.appendChild(btn);
        });

        function toggleFamily(family, btn) {
            if (activeFilters.has(family)) {
                activeFilters.delete(family);
                btn.className = "filter-btn inactive";
            } else {
                activeFilters.add(family);
                btn.className = "filter-btn active";
            }
            applyFilters();
        }

        function applyFilters() {
            const visibleNodeIds = new Set();
            characters.forEach(c => {
                if (activeFilters.has(c.family)) {
                    visibleNodeIds.add(c.id);
                    nodes.update({ id: c.id, hidden: false });
                } else {
                    nodes.update({ id: c.id, hidden: true });
                }
            });

            relationships.forEach((r, i) => {
                const visible = visibleNodeIds.has(r.from) && visibleNodeIds.has(r.to);
                edges.update({ id: i, hidden: !visible });
            });
        }

        // Click event - show info panel
        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const character = characters.find(c => c.id === nodeId);
                if (character) {
                    const trans = translations[currentTranslation];
                    document.getElementById("info-name").textContent = trans[character.id] || character.label;
                    document.getElementById("info-desc").textContent = character.desc;
                    document.getElementById("info-panel").style.display = "block";
                }
            } else {
                closeInfoPanel();
            }
        });

        // Double-click to focus on neighbors
        network.on("doubleClick", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const connectedNodes = network.getConnectedNodes(nodeId);
                connectedNodes.push(nodeId);
                network.fit({ nodes: connectedNodes, animation: true });
            }
        });

        function closeInfoPanel() {
            document.getElementById("info-panel").style.display = "none";
        }

        function resetView() {
            network.fit({ animation: true });
        }

        let physicsEnabled = true;
        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            if (physicsEnabled) {
                network.setOptions({ physics: { enabled: true, stabilization: { enabled: false } } });
                // 给节点一个微小扰动让物理引擎重新活跃
                characters.forEach(c => {
                    const pos = network.getPositions([c.id])[c.id];
                    if (pos) {
                        nodes.update({ id: c.id, x: pos.x + (Math.random() - 0.5) * 20, y: pos.y + (Math.random() - 0.5) * 20 });
                    }
                });
            } else {
                network.setOptions({ physics: { enabled: false } });
            }
            document.getElementById("physics-btn").textContent = "物理引擎：" + (physicsEnabled ? "开" : "关");
        }

        // Search functionality
        document.getElementById("search-box").addEventListener("input", function (e) {
            const query = e.target.value.trim().toLowerCase();
            if (!query) {
                characters.forEach(c => {
                    if (activeFilters.has(c.family)) {
                        nodes.update({ id: c.id, opacity: 1, size: c.id === 20 || c.id === 11 || c.id === 4 ? 28 : (c.id === 50 || c.id === 51 ? 24 : 18), font: { color: "#eee" } });
                    }
                });
                return;
            }

            const trans = translations[currentTranslation];
            const matchedIds = new Set();
            characters.forEach(c => {
                const currentLabel = (trans[c.id] || c.label).toLowerCase();
                if (currentLabel.includes(query) || c.desc.toLowerCase().includes(query)) {
                    matchedIds.add(c.id);
                }
            });

            characters.forEach(c => {
                if (matchedIds.has(c.id)) {
                    nodes.update({ id: c.id, opacity: 1, size: c.id === 20 || c.id === 11 || c.id === 4 ? 32 : 22 });
                } else {
                    nodes.update({ id: c.id, opacity: 0.15, size: 12 });
                }
            });

            if (matchedIds.size > 0 && matchedIds.size <= 5) {
                network.fit({ nodes: Array.from(matchedIds), animation: true });
            }
        });

        // Translation switching
        document.getElementById("translation-select").addEventListener("change", function (e) {
            currentTranslation = e.target.value;
            const trans = translations[currentTranslation];
            const familyTrans = familyNameTranslations[currentTranslation];

            // Update node labels and tooltips
            characters.forEach(c => {
                const newLabel = trans[c.id] || c.label;
                c._currentLabel = newLabel;
                nodes.update({ id: c.id, label: newLabel, title: c.desc });
            });

            // Update sidebar family legend
            document.querySelectorAll(".legend-item[data-family]").forEach(item => {
                const family = item.dataset.family;
                const dot = item.querySelector(".legend-dot");
                const textNode = item.childNodes[item.childNodes.length - 1];
                if (family === "other") {
                    textNode.textContent = "\n                    " + familyTrans[family] + "重要人物\n                ";
                } else {
                    textNode.textContent = "\n                    " + familyTrans[family] + "家族\n                ";
                }
            });

            // Update filter buttons
            document.querySelectorAll(".filter-btn[data-family]").forEach(btn => {
                const family = btn.dataset.family;
                btn.textContent = familyTrans[family];
            });

            // Update info panel if open
            const infoPanel = document.getElementById("info-panel");
            if (infoPanel.style.display === "block") {
                const infoName = document.getElementById("info-name").textContent;
                const character = characters.find(c => (c._currentLabel || c.label) === infoName || c.label === infoName);
                if (character) {
                    document.getElementById("info-name").textContent = trans[character.id] || character.label;
                    document.getElementById("info-desc").textContent = character.desc;
                }
            }

            // Update familyNames for filter generation
            Object.keys(familyNames).forEach(k => { familyNames[k] = familyTrans[k]; });
        });

        // Legend item hover - highlight family
        document.querySelectorAll(".legend-item[data-family]").forEach(item => {
            item.addEventListener("mouseenter", function () {
                const family = this.dataset.family;
                const familyNodeIds = characters.filter(c => c.family === family).map(c => c.id);
                network.selectNodes(familyNodeIds);
            });
            item.addEventListener("mouseleave", function () {
                network.unselectAll();
            });
        });

        // Initial fit after stabilization
        network.once("stabilizationIterationsDone", function () {
            network.fit({ animation: false });
        });
    </script>
</body>
</html>
